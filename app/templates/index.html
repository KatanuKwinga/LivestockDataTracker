{% extends "_scene.html" %}
{% block title %}Welcome{% endblock %}
{% block panel %}
  <div>
    <h2>Welcome</h2>
    <p class="hint">Which account are you signing in to?</p>
  </div>
  <div class="role-choices">
    <a class="role-choice" href="{{ url_for('auth.login', role='farmer', next=request.args.get('next')) }}">
      <div><strong>Farmer</strong><span>Your herd, insights, predictions and workers</span></div>
      <svg class="arrow" aria-hidden="true"><use href="#arrow"/></svg>
    </a>
    <a class="role-choice" href="{{ url_for('auth.login', role='worker', next=request.args.get('next')) }}">
      <div><strong>Worker</strong><span>Record health, weights, births and sales</span></div>
      <svg class="arrow" aria-hidden="true"><use href="#arrow"/></svg>
    </a>
  </div>
  <p class="foot">New to Livestock Tracker? <a class="link-line" href="{{ url_for('auth.register') }}">Register your farm</a></p>
{% endblock %}
